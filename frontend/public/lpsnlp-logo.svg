<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>LPSNLP School Logo</title>
<desc>Crest logo for RPM Lovely Public Senior Secondary School, New Layal Pur Delhi, featuring a shield with book and torch, established 1966</desc>
<defs>
  <clipPath id="shieldClip">
    <path d="M340 60 L480 100 L480 280 Q480 380 340 440 Q200 380 200 280 L200 100 Z"/>
  </clipPath>
</defs>

<!-- Shield outer border / shadow layer -->
<path d="M340 52 L492 94 L492 282 Q492 392 340 456 Q188 392 188 282 L188 94 Z" fill="#1E40AF" opacity="0.18"/>

<!-- Shield main body -->
<path d="M340 60 L480 100 L480 280 Q480 380 340 440 Q200 380 200 280 L200 100 Z" fill="#2563EB"/>

<!-- Shield inner lighter band (top) -->
<path d="M340 60 L480 100 L480 150 L200 150 L200 100 Z" fill="#1E40AF"/>

<!-- Shield white inset border -->
<path d="M340 68 L472 106 L472 280 Q472 374 340 432 Q208 374 208 280 L208 106 Z" fill="none" stroke="white" stroke-width="2" opacity="0.35"/>

<!-- Book shape, centered low in shield -->
<rect x="280" y="230" width="120" height="80" rx="4" fill="white" opacity="0.95"/>
<!-- Book spine -->
<rect x="336" y="230" width="8" height="80" fill="#2563EB"/>
<!-- Book pages lines left -->
<line x1="296" y1="252" x2="332" y2="252" stroke="#E5E7EB" stroke-width="2"/>
<line x1="296" y1="264" x2="332" y2="264" stroke="#E5E7EB" stroke-width="2"/>
<line x1="296" y1="276" x2="332" y2="276" stroke="#E5E7EB" stroke-width="2"/>
<line x1="296" y1="288" x2="332" y2="288" stroke="#E5E7EB" stroke-width="2"/>
<!-- Book pages lines right -->
<line x1="348" y1="252" x2="384" y2="252" stroke="#E5E7EB" stroke-width="2"/>
<line x1="348" y1="264" x2="384" y2="264" stroke="#E5E7EB" stroke-width="2"/>
<line x1="348" y1="276" x2="384" y2="276" stroke="#E5E7EB" stroke-width="2"/>
<line x1="348" y1="288" x2="384" y2="288" stroke="#E5E7EB" stroke-width="2"/>

<!-- Torch handle -->
<rect x="334" y="148" width="12" height="72" rx="3" fill="#FCD34D"/>
<!-- Torch cup -->
<path d="M322 150 Q340 138 358 150 L354 176 Q340 184 326 176 Z" fill="#F59E0B"/>
<!-- Flame outer -->
<path d="M340 100 Q356 118 352 138 Q346 152 340 148 Q334 152 328 138 Q324 118 340 100 Z" fill="#FCD34D"/>
<!-- Flame inner -->
<path d="M340 112 Q349 125 347 138 Q343 147 340 145 Q337 147 333 138 Q331 125 340 112 Z" fill="#F97316"/>
<!-- Flame tip glow -->
<ellipse cx="340" cy="110" rx="5" ry="8" fill="white" opacity="0.6"/>

<!-- Shield bottom notch decorative line -->
<line x1="260" y1="210" x2="420" y2="210" stroke="white" stroke-width="1.5" opacity="0.4"/>

<!-- Left laurel -->
<path d="M258 340 Q238 310 242 280 Q244 260 256 244" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
<circle cx="254" cy="244" r="5" fill="#FCD34D"/>
<circle cx="243" cy="268" r="4" fill="#FCD34D" opacity="0.8"/>
<circle cx="239" cy="294" r="4" fill="#FCD34D" opacity="0.7"/>
<circle cx="247" cy="320" r="4" fill="#FCD34D" opacity="0.6"/>
<!-- Right laurel -->
<path d="M422 340 Q442 310 438 280 Q436 260 424 244" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
<circle cx="426" cy="244" r="5" fill="#FCD34D"/>
<circle cx="437" cy="268" r="4" fill="#FCD34D" opacity="0.8"/>
<circle cx="441" cy="294" r="4" fill="#FCD34D" opacity="0.7"/>
<circle cx="433" cy="320" r="4" fill="#FCD34D" opacity="0.6"/>

<!-- LPS monogram -->
<text x="340" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white" letter-spacing="6">LPS</text>
<!-- Divider line under LPS -->
<line x1="296" y1="196" x2="384" y2="196" stroke="#FCD34D" stroke-width="1.5" opacity="0.7"/>

<!-- Subtle base shadow -->
<ellipse cx="340" cy="472" rx="172" ry="22" fill="#1E40AF" opacity="0.12"/>

<!-- Full school name below shield -->
<text x="340" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#111827" letter-spacing="0.5">Lovely Public Sr. Sec. School</text>
<text x="340" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" fill="#6B7280" letter-spacing="1">New Layal Pur, Delhi  ·  Est. 1966</text>
<text x="340" y="508" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" fill="#2563EB" letter-spacing="2">CBSE AFFILIATED</text>

</svg>
